<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>로열 홀덤</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: 카지노 테이블이 화면 중심, 오른쪽(모바일은 아래) 사이드 패널에 미션·업적·기록. 단일 다크 카지노 테마. */
:root{
  color-scheme: dark;
  --night:#0b1311;
  --panel:#121c1a;
  --panel-2:#192724;
  --line:#2a3b37;
  --text:#ecefe6;
  --muted:#93a39c;
  --felt:#11603f;
  --felt-hi:#1a8a58;
  --felt-deep:#083322;
  --rim:#4a2a17;
  --rim-hi:#8a5630;
  --rim-dark:#22130a;
  --brass:#d9a94a;
  --brass-hi:#f3d58a;
  --ivory:#f8f4e9;
  --card-red:#c8323b;
  --card-black:#1b1f24;
  --back-1:#7a1f2b;
  --back-2:#93303d;
  --win:#5fd28f;
  --danger:#e5604f;
  --info:#6aa8ff;
  --shadow:rgba(0,0,0,.55);
  --f-display:'Black Han Sans','Noto Sans KR',system-ui,sans-serif;
  --f-body:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-num:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --cwb:clamp(38px,5.6vw,60px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{
  margin:0;background:var(--night);color:var(--text);font-family:var(--f-body);font-size:14px;
  background-image:radial-gradient(1200px 600px at 50% -10%, var(--panel-2), transparent 70%);
  padding-inline:16px;padding-block:12px 28px;
}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
button:disabled{cursor:not-allowed;opacity:.45}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* ---------- HUD ---------- */
.hud{max-width:1240px;margin:0 auto 14px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand-mark{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:24px;background:linear-gradient(145deg,var(--brass-hi),var(--brass));color:var(--card-black)}
.brand b{display:block;font-family:var(--f-display);font-size:22px;letter-spacing:.04em;font-weight:400;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.lvl{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 12px 6px 6px;min-width:0}
.lvl-badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;background:conic-gradient(var(--brass-hi) var(--p,0%), var(--line) 0);position:relative}
.lvl-badge span{position:absolute;inset:4px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center}
.lvl-info{min-width:130px}
.lvl-title{font-size:12px;font-weight:700;color:var(--brass-hi);letter-spacing:.02em}
.xpbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass-hi));transition:width .6s ease}
.lvl-info small{font-size:11px;color:var(--muted)}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700}
.pill small{font-weight:500;color:var(--muted);font-size:11px}
.pill.hot{border-color:var(--danger);box-shadow:0 0 18px -4px var(--danger)}
.chipdot{width:18px;height:18px;border-radius:50%;flex:none;background:radial-gradient(circle,var(--brass-hi) 0 34%,var(--danger) 36% 62%,var(--ivory) 64% 70%,var(--danger) 72%);box-shadow:0 1px 2px var(--shadow)}
.hud-btns{display:flex;gap:6px}
.ghost{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700}
.ghost:hover{border-color:var(--brass)}
.ghost[aria-pressed="true"]{border-color:var(--brass);color:var(--brass-hi)}

/* ---------- Layout ---------- */
.layout{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.table-zone{display:flex;flex-direction:column;gap:12px;min-width:0}

/* ---------- Table ---------- */
.table{position:relative;width:100%;max-width:900px;margin-inline:auto;aspect-ratio:16/9.6}
.felt{
  position:absolute;inset:10% 8% 12%;border-radius:999px;
  background:radial-gradient(ellipse at 50% 38%, var(--felt-hi) 0%, var(--felt) 42%, var(--felt-deep) 100%);
  box-shadow:0 0 0 12px var(--rim),0 0 0 14px var(--rim-hi),0 0 0 18px var(--rim-dark),inset 0 0 70px var(--shadow),0 26px 60px var(--shadow);
}
.felt::before{content:"";position:absolute;inset:7% 5%;border-radius:999px;border:2px solid var(--brass);opacity:.22}
.felt-logo{font-family:var(--f-display);font-size:clamp(11px,1.5vw,15px);letter-spacing:.3em;color:var(--brass);opacity:.35;white-space:nowrap;pointer-events:none}
.center{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.phase{font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--brass-hi);background:rgba(0,0,0,.28);padding:3px 10px;border-radius:99px}
.board{display:flex;gap:6px;--cw:var(--cwb)}
.slot{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.12);border:2px dashed rgba(243,213,138,.22)}
.pot{display:flex;align-items:center;gap:8px;font-weight:700;background:rgba(0,0,0,.35);padding:5px 14px 5px 6px;border-radius:999px;font-size:14px}
.pot small{color:var(--muted);font-weight:500;font-size:11px}

/* ---------- Cards ---------- */
.card{width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.12);background:var(--ivory);position:relative;flex:none;
  box-shadow:0 2px 0 rgba(0,0,0,.18),0 6px 14px var(--shadow);font-family:var(--f-num);transition:transform .25s, filter .25s, box-shadow .25s}
.card.red{color:var(--card-red)} .card.black{color:var(--card-black)}
.card .tl{position:absolute;top:5%;left:9%;font-weight:700;font-size:calc(var(--cw)*.3);line-height:1;text-align:center;letter-spacing:-.04em}
.card .tl span{display:block;font-size:calc(var(--cw)*.26)}
.card .mid{position:absolute;right:9%;bottom:6%;font-size:calc(var(--cw)*.56);line-height:1}
.card.back{background:repeating-linear-gradient(45deg,var(--back-1) 0 4px,var(--back-2) 4px 8px);border:3px solid var(--ivory)}
.card.back::after{content:"";position:absolute;inset:18% 22%;border-radius:50%;border:1.5px solid var(--brass-hi);opacity:.55}
.card.win{transform:translateY(-7px);box-shadow:0 0 0 3px var(--brass-hi),0 10px 22px var(--shadow),0 0 26px rgba(243,213,138,.55)}
.card.dim{filter:brightness(.5) saturate(.6)}
.card.deal{animation:deal .38s cubic-bezier(.2,.8,.2,1) both}
.card.flip{animation:flip .45s ease both}
@keyframes deal{from{transform:translateY(-46px) rotate(-10deg) scale(.6);opacity:0}}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}

/* ---------- Seats ---------- */
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:5px;width:clamp(112px,18vw,168px);z-index:3}
.seat-cards{display:flex;gap:4px;--cw:calc(var(--cwb)*.8);min-height:calc(var(--cw)*1.4)}
.plate{position:relative;display:flex;align-items:center;gap:8px;width:100%;background:linear-gradient(var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:999px;padding:4px 12px 4px 4px;box-shadow:0 8px 20px var(--shadow);transition:box-shadow .3s,border-color .3s}
.avatar{width:36px;height:36px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-size:16px;color:var(--card-black);background:var(--c,var(--brass))}
.pinfo{min-width:0;line-height:1.25}
.pname{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname em{font-style:normal;color:var(--muted);font-size:10px;font-weight:500;margin-left:4px}
.pchips{font-family:var(--f-num);font-size:12px;color:var(--brass-hi)}
.dealer{position:absolute;right:-6px;top:-8px;width:22px;height:22px;border-radius:50%;background:var(--ivory);color:var(--card-black);font-weight:900;font-size:11px;display:grid;place-items:center;border:2px solid var(--brass)}
.bubble{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--ivory);color:var(--card-black);min-height:19px;white-space:nowrap}
.bubble:empty{visibility:hidden}
.bubble.fold{background:var(--line);color:var(--muted)}
.bubble.allin{background:var(--danger);color:var(--ivory)}
.bubble.hand{background:var(--brass-hi)}
.seat.turn .plate{border-color:var(--brass-hi);animation:pulse 1.2s ease-in-out infinite}
.seat.folded .plate,.seat.folded .seat-cards{opacity:.42}
.seat.winner .plate{border-color:var(--win);box-shadow:0 0 0 2px var(--win),0 0 30px rgba(95,210,143,.55)}
.win-float{position:absolute;left:50%;top:-6px;transform:translateX(-50%);font-family:var(--f-num);font-weight:700;color:var(--win);font-size:16px;text-shadow:0 2px 8px var(--shadow);animation:floatUp 1.8s ease-out both;pointer-events:none;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 2px var(--brass-hi),0 0 10px rgba(243,213,138,.25)}50%{box-shadow:0 0 0 2px var(--brass-hi),0 0 30px rgba(243,213,138,.6)}}

.s0{left:50%;bottom:-1%;transform:translateX(-50%);flex-direction:row;align-items:flex-end;width:auto;gap:10px}
.s0 .seat-cards{--cw:calc(var(--cwb)*1.05)}
.s0 .stack{display:flex;flex-direction:column;align-items:center;gap:5px;width:clamp(124px,18vw,168px)}
.s1{left:0;top:47%;transform:translateY(-50%)}
.s2{left:50%;top:0;transform:translateX(-50%)}
.s3{right:0;top:47%;transform:translateY(-50%)}

.bet{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:6px;font-family:var(--f-num);font-size:12px;font-weight:700;color:var(--ivory);background:rgba(0,0,0,.4);padding:2px 9px 2px 3px;border-radius:999px;z-index:2;transition:opacity .25s}
.bet:empty{opacity:0}
.b0{left:50%;top:70%} .b1{left:25%;top:50%} .b2{left:50%;top:29%} .b3{left:75%;top:50%}

/* ---------- Coach / Controls ---------- */
.coach{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px}
.coach b{color:var(--brass-hi)}
.coach .tag{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--muted)}
.meter{flex:1 1 140px;height:8px;background:var(--line);border-radius:99px;overflow:hidden;min-width:100px}
.meter i{display:block;height:100%;width:0;transition:width .4s;background:linear-gradient(90deg,var(--danger),var(--brass),var(--win))}
.coach .tip{flex-basis:100%;color:var(--muted);font-size:12px}

.controls{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;min-height:118px;justify-content:center}
.act-row{display:grid;grid-template-columns:1fr 1.2fr 1.4fr;gap:10px}
.act{border:0;border-radius:12px;padding:14px 10px;font-size:16px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .1s, filter .2s;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.act:active:not(:disabled){transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.act:hover:not(:disabled){filter:brightness(1.1)}
.act.fold{background:var(--line);color:var(--text)}
.act.call{background:var(--info);color:var(--card-black)}
.act.raise{background:linear-gradient(var(--brass-hi),var(--brass));color:var(--card-black)}
kbd{font-family:var(--f-num);font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,.2);font-weight:700}
.raise-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.preset{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.preset:hover:not(:disabled){border-color:var(--brass)}
.raise-row input{flex:1 1 160px;accent-color:var(--brass);min-width:120px}
.status{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.status p{margin:0;flex:1 1 220px;line-height:1.5}
.status p b{color:var(--brass-hi)}
.big{border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:900;background:linear-gradient(var(--brass-hi),var(--brass));color:var(--card-black);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.big:hover{filter:brightness(1.08)}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--brass-hi);margin-left:3px;animation:blink 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}

/* ---------- Side panel ---------- */
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.box h2{margin:0 0 10px;font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.03em;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.box h2 small{font-family:var(--f-body);font-size:11px;color:var(--muted);font-weight:500}
.mission{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.mission:first-of-type{border-top:0;padding-top:2px}
.mission .mt{font-size:13px;font-weight:700}
.mission .mr{font-size:11px;color:var(--brass-hi);font-family:var(--f-num)}
.mission .bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.mission .bar i{display:block;height:100%;background:var(--win);transition:width .5s}
.claim{border:0;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:900;background:var(--win);color:var(--card-black)}
.claim.ready{animation:pulseG 1.2s infinite}
@keyframes pulseG{50%{box-shadow:0 0 16px rgba(95,210,143,.8)}}
.mprog{font-size:11px;color:var(--muted);font-family:var(--f-num)}
.ach-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.ach{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;padding:8px 2px;border-radius:10px;background:var(--panel-2);border:1px solid var(--line);font-size:10px;line-height:1.25;color:var(--muted)}
.ach i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--line);color:var(--muted);font-family:var(--f-display)}
.ach.on{color:var(--text);border-color:var(--brass)}
.ach.on i{background:linear-gradient(145deg,var(--brass-hi),var(--brass));color:var(--card-black)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--panel-2);border-radius:10px;padding:8px 10px}
.stat small{display:block;font-size:10px;color:var(--muted);letter-spacing:.06em}
.stat b{font-family:var(--f-num);font-size:15px}
.log{max-height:170px;overflow-y:auto;font-size:12px;display:flex;flex-direction:column;gap:3px;color:var(--muted)}
.log div b{color:var(--text)}
.log .hl{color:var(--brass-hi)}

/* ---------- Toasts / Modals ---------- */
#toasts{position:fixed;right:16px;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;max-width:calc(100vw - 32px)}
.toast{display:flex;gap:10px;align-items:center;background:var(--panel-2);border:1px solid var(--brass);border-radius:12px;padding:10px 14px;box-shadow:0 12px 30px var(--shadow);animation:tin .35s ease both;min-width:220px}
.toast i{font-style:normal;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--brass-hi),var(--brass));color:var(--card-black);font-family:var(--f-display);flex:none}
.toast b{display:block;font-size:13px}.toast small{color:var(--muted);font-size:12px}
.toast.out{animation:tout .3s ease both}
@keyframes tin{from{opacity:0;transform:translateX(30px)}}
@keyframes tout{to{opacity:0;transform:translateX(30px)}}
.modal-bg{position:fixed;inset:0;background:rgba(3,8,6,.72);display:grid;place-items:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;width:min(520px,100%);max-height:88vh;overflow:auto;box-shadow:0 30px 80px var(--shadow)}
.modal h3{margin:0 0 6px;font-family:var(--f-display);font-weight:400;font-size:24px;color:var(--brass-hi)}
.modal p{margin:0 0 14px;color:var(--muted);line-height:1.6}
.modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.day{text-align:center;border:1px solid var(--line);border-radius:10px;padding:8px 2px;font-size:11px;color:var(--muted);background:var(--panel-2)}
.day b{display:block;font-family:var(--f-num);color:var(--text);font-size:12px;margin-top:2px}
.day.done{border-color:var(--win);color:var(--win)}
.day.today{border-color:var(--brass-hi);box-shadow:0 0 14px rgba(243,213,138,.4);color:var(--brass-hi)}
.ranks{display:flex;flex-direction:column;gap:8px}
.rank{display:grid;grid-template-columns:118px 1fr auto;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank b{font-size:13px}
.rank .mini{display:flex;gap:3px;--cw:26px}
.rank .mini .card{box-shadow:0 1px 3px var(--shadow)}
.rank .mini .card .mid{display:none}
.rank small{font-family:var(--f-num);font-size:11px;color:var(--muted)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:70}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .side{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
}
@media (max-width:640px){
  :root{--cwb:40px}
  .brand b{font-size:18px}
  .table{aspect-ratio:3/4.3}
  .felt{inset:13% 3% 15%}
  .felt-logo{display:none}
  .center{top:51%}
  .seat{width:104px}
  .seat-cards{--cw:calc(var(--cwb)*.78)}
  .s0 .seat-cards{--cw:calc(var(--cwb)*1.05)}
  .s0 .stack{width:124px}
  .s1{left:0;top:16%;transform:none}
  .s3{right:0;top:16%;transform:none}
  .s2{top:0}
  .b0{top:72%} .b1{left:18%;top:39%} .b3{left:82%;top:39%} .b2{top:27%}
  .avatar{width:30px;height:30px;font-size:14px}
  .plate{padding-right:8px;gap:6px}
  .act{font-size:14px;padding:12px 6px}
  .act kbd{display:none}
  .rank{grid-template-columns:92px 1fr}
  .rank small{grid-column:2}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<header class="hud">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">♠</div>
    <div><b>ROYAL HOLD'EM</b><small>텍사스 홀덤 · 블라인드 <span class="num" id="hudBlinds">10/20</span> · 핸드 <span class="num" id="hudHand">0</span></small></div>
  </div>
  <div class="lvl" title="레벨과 경험치">
    <div class="lvl-badge" id="lvlBadge"><span id="lvlNum">1</span></div>
    <div class="lvl-info">
      <div class="lvl-title" id="lvlTitle">브론즈 루키</div>
      <div class="xpbar"><i id="xpFill"></i></div>

<script>
(() => {
'use strict';

/* ============ Utilities ============ */
const $ = s => document.querySelector(s);
const fmt = n => Math.round(n).toLocaleString('ko-KR');
let speed = 1;
const sleep = ms => new Promise(r => setTimeout(r, ms * speed));
const rand = n => Math.floor(Math.random() * n);
const localDay = d => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };

/* ============ Profile (저장) ============ */
const SAVE_KEY = 'royal-holdem-v1';
const defaults = () => ({
  chips: 1000, level: 1, xp: 0, streak: 0,
  stats: { hands: 0, wins: 0, sdWins: 0, bestStreak: 0, biggestPot: 0, rebuys: 0 },
  missions: [], ach: {}, lastDaily: null, loginStreak: 0, sound: false, coach: true
});
let profile = defaults();
try {
  const saved = JSON.parse(localStorage.getItem(SAVE_KEY));
  if (saved) { profile = Object.assign(defaults(), saved); profile.stats = Object.assign(defaults().stats, saved.stats || {}); }
} catch (e) { /* 저장소 사용 불가 시 기본값 */ }
function save() {
  profile.chips = players[0].chips;
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(profile)); } catch (e) {}
}

/* ============ Sound ============ */
let actx = null;
function tone(freq, dur = .08, type = 'sine', vol = .05, when = 0) {
  if (!profile.sound) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .02);
  } catch (e) {}
}
const SFX = {
  deal: () => tone(950, .035, 'triangle', .03),
  chip: () => { tone(1500, .03, 'square', .018); tone(1900, .03, 'square', .014, .035); },
  check: () => tone(520, .05, 'sine', .04),
  fold: () => tone(240, .12, 'sine', .035),
  win: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, .2, 'triangle', .06, i * .09)),
  lose: () => { tone(330, .18, 'sine', .04); tone(247, .3, 'sine', .04, .15); },
  level: () => [392, 523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'sawtooth', .025, i * .08)),
  ach: () => [880, 1175, 1568].forEach((f, i) => tone(f, .16, 'triangle', .05, i * .07)),
  turn: () => tone(740, .07, 'sine', .04)
};

/* ============ Cards & Evaluation ============ */
const SUITS = ['♠', '♥', '♦', '♣'];
const SUIT_NAME = ['스페이드', '하트', '다이아몬드', '클로버'];
const rch = r => ({ 10: '10', 11: 'J', 12: 'Q', 13: 'K', 14: 'A' })[r] || String(r);
const key = c => c.r * 4 + c.s;
function makeDeck() {
  const d = [];
  for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) d.push({ r, s });
  for (let i = d.length - 1; i > 0; i--) { const j = rand(i + 1); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
const HAND_NAMES = ['하이카드', '원 페어', '투 페어', '트리플', '스트레이트', '플러시', '풀하우스', '포카드', '스트레이트 플러시'];
const P4 = 15 ** 4, P5 = 15 ** 5;
const catOf = s => Math.floor(s / P5);

function eval5(c) {
  const rs = [c[0].r, c[1].r, c[2].r, c[3].r, c[4].r].sort((a, b) => b - a);
  const flush = c[0].s === c[1].s && c[0].s === c[2].s && c[0].s === c[3].s && c[0].s === c[4].s;
  const cnt = {};
  for (const r of rs) cnt[r] = (cnt[r] || 0) + 1;
  const groups = Object.keys(cnt).map(r => [+r, cnt[r]]).sort((a, b) => b[1] - a[1] || b[0] - a[0]);
  let sh = 0;
  if (groups.length === 5) {
    if (rs[0] - rs[4] === 4) sh = rs[0];
    else if (rs[0] === 14 && rs[1] === 5) sh = 5;
  }
  let cat, k;
  if (sh && flush) { cat = 8; k = [sh]; }
  else if (groups[0][1] === 4) { cat = 7; k = [groups[0][0], groups[1][0]]; }
  else if (groups[0][1] === 3 && groups[1][1] === 2) { cat = 6; k = [groups[0][0], groups[1][0]]; }
  else if (flush) { cat = 5; k = rs; }
  else if (sh) { cat = 4; k = [sh]; }
  else if (groups[0][1] === 3) { cat = 3; k = groups.map(g => g[0]); }
  else if (groups[0][1] === 2 && groups[1][1] === 2) { cat = 2; k = groups.map(g => g[0]); }
  else if (groups[0][1] === 2) { cat = 1; k = groups.map(g => g[0]); }
  else { cat = 0; k = rs; }
  let s = cat;
  for (let i = 0; i < 5; i++) s = s * 15 + (k[i] || 0);
  return s;
}
const COMBOS = {};
function combos(n) {
  if (COMBOS[n]) return COMBOS[n];
  const out = [], acc = [];
  (function rec(st) {
    if (acc.length === 5) { out.push(acc.slice()); return; }
    for (let i = st; i < n; i++) { acc.push(i); rec(i + 1); acc.pop(); }
  })(0);
  return (COMBOS[n] = out);
}
const five = new Array(5);
function best(cards) {
  let bs = -1, bc = null;
  for (const cb of combos(cards.length)) {
    for (let i = 0; i < 5; i++) five[i] = cards[cb[i]];
    const s = eval5(five);
    if (s > bs) { bs = s; bc = cb; }
  }
  return { score: bs, cards: bc.map(i => cards[i]) };
}
function bestScore(cards) {
  let bs = -1;
  for (const cb of combos(cards.length)) {
    for (let i = 0; i < 5; i++) five[i] = cards[cb[i]];
    const s = eval5(five);
    if (s > bs) bs = s;
  }
  return bs;
}
function describe(score) {
  const c = catOf(score), k0 = Math.floor(score / P4) % 15, k1 = Math.floor(score / 15 ** 3) % 15;
  switch (c) {
    case 8: return k0 === 14 ? '로열 플러시' : `스트레이트 플러시 · ${rch(k0)} 하이`;
    case 7: return `포카드 · ${rch(k0)}`;
    case 6: return `풀하우스 · ${rch(k0)}/${rch(k1)}`;
    case 5: return `플러시 · ${rch(k0)} 하이`;
    case 4: return `스트레이트 · ${rch(k0)} 하이`;
    case 3: return `트리플 · ${rch(k0)}`;
    case 2: return `투 페어 · ${rch(k0)} & ${rch(k1)}`;
    case 1: return `원 페어 · ${rch(k0)}`;
    default: return `하이카드 · ${rch(k0)}`;
  }
}
function describePartial(hole, board) {
  const all = hole.concat(board);
  if (all.length >= 5) return describe(bestScore(all));
  if (hole[0].r === hole[1].r) return `포켓 페어 · ${rch(hole[0].r)}`;
  const hi = Math.max(hole[0].r, hole[1].r);
  return `하이카드 · ${rch(hi)}${hole[0].s === hole[1].s ? ' (수딧)' : ''}`;
}

/* 몬테카를로 승률 추정 */
function equity(hole, board, nOpp, iters) {
  if (nOpp <= 0) return 1;
  const used = new Set(hole.concat(board).map(key));
  const rest = [];
  for (let s = 0; s < 4; s++) for (let r = 2; r <= 14; r++) if (!used.has(r * 4 + s)) rest.push({ r, s });
  const nb = 5 - board.length, need = nb + nOpp * 2;
  let score = 0;
  for (let it = 0; it < iters; it++) {
    for (let i = 0; i < need; i++) { const j = i + rand(rest.length - i); const t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
    const fb = board.concat(rest.slice(0, nb));
    const my = bestScore(hole.concat(fb));
    let ties = 0, lose = false;
    for (let o = 0; o < nOpp; o++) {
      const s = bestScore([rest[nb + o * 2], rest[nb + o * 2 + 1]].concat(fb));
      if (s > my) { lose = true; break; }
      if (s === my) ties++;
    }
    if (!lose) score += 1 / (ties + 1);
  }
  return score / iters;
}

/* ============ Players ============ */
const BOT_POOL = [
  { name: '하나', style: '공격형', aggr: .8, loose: .55, bluff: .35, color: '#e88aae' },
  { name: '준호', style: '신중형', aggr: .3, loose: .25, bluff: .08, color: '#7db7ea' },
  { name: '미라', style: '블러퍼', aggr: .65, loose: .5, bluff: .6, color: '#bfa0f4' },
  { name: '태오', style: '콜링형', aggr: .2, loose: .85, bluff: .1, color: '#f0b07a' },
  { name: '소율', style: '밸런스', aggr: .5, loose: .4, bluff: .2, color: '#6fd1b4' },
  { name: '레오', style: '공격형', aggr: .85, loose: .6, bluff: .4, color: '#ec8a7e' },
  { name: '지안', style: '신중형', aggr: .35, loose: .3, bluff: .12, color: '#a6c2ff' },
  { name: '도윤', style: '블러퍼', aggr: .7, loose: .45, bluff: .55, color: '#e2c46e' }
];
function freshHandState(p) {
  Object.assign(p, { hand: [], bet: 0, total: 0, folded: false, allIn: false, acted: false, inHand: false, lastAction: '', revealed: false, best: null, winAmt: 0, floated: false });
  return p;
}
function makeBot(seat, chips) {
  const used = new Set(players.filter(Boolean).map(p => p.name));
  const pool = BOT_POOL.filter(b => !used.has(b.name));
  const b = pool[rand(pool.length)];
  return freshHandState({ seat, isHuman: false, name: b.name, style: b.style, st: b, color: b.color, chips });
}
const players = [];
players[0] = freshHandState({ seat: 0, isHuman: true, name: '나', style: '플레이어', color: 'var(--brass-hi)', chips: profile.chips > 0 ? profile.chips : 1000 });
for (let i = 1; i <= 3; i++) players[i] = makeBot(i, 1000);
const N = 4;
const next = i => (i + 1) % N;

/* ============ Game State ============ */
const BLINDS = [[10, 20], [15, 30], [25, 50], [50, 100], [100, 200]];
const PHASE_LABEL = { idle: '대기 중', preflop: '프리플랍', flop: '플랍', turn: '턴', river: '리버', showdown: '쇼다운', done: '핸드 종료' };
const G = {
  dealer: rand(N), sb: 10, bb: 20, blindLv: 0, handNo: 0, deck: [], board: [], phase: 'idle',
  currentBet: 0, minRaise: 20, raises: 0, toAct: -1, thinking: -1, waitingHuman: false,
  highlight: null, humanAllIn: false, chipsBefore: 0, lastResult: null
};

const potTotal = () => players.reduce((a, p) => a + p.total, 0);
const canAct = p => p.inHand && !p.folded && !p.allIn;
const contenders = () => players.filter(p => p.inHand && !p.folded);

function putChips(p, amt) {
  amt = Math.max(0, Math.min(amt, p.chips));
  p.chips -= amt; p.bet += amt; p.total += amt;
  if (p.chips === 0) p.allIn = true;
  return amt;
}

/* ============ Flow ============ */
async function startHand() {
  if (!isIdle()) return;
  clearConfetti();
  const me = players[0];
  if (me.chips <= 0) { showBroke(); return; }
  for (let i = 1; i < N; i++) {
    if (players[i].chips <= 0) {
      const old = players[i].name;
      players[i] = makeBot(i, Math.max(1000, G.bb * 50));
      addLog(`<b>${old}</b> 탈락 → 새 도전자 <b>${players[i].name}</b>(${players[i].style}) 입장`, 'hl');
    }
  }
  G.handNo++;
  const lv = Math.min(BLINDS.length - 1, Math.floor((G.handNo - 1) / 12));
  if (lv !== G.blindLv) toast('▲', '블라인드 상승', `이제 ${BLINDS[lv][0]}/${BLINDS[lv][1]} 입니다`);
  G.blindLv = lv; [G.sb, G.bb] = BLINDS[lv];
  players.forEach(p => { freshHandState(p); p.inHand = p.chips > 0; });
  G.dealer = next(G.dealer);
  G.deck = makeDeck(); G.board = []; G.highlight = null; G.raises = 0; G.humanAllIn = false;
  G.chipsBefore = me.chips; G.phase = 'preflop'; G.lastResult = null;
  profile.stats.hands++;
  addLog(`— 핸드 #${G.handNo} · 딜러 <b>${players[G.dealer].name}</b> —`);

  const sbI = next(G.dealer), bbI = next(sbI);
  putChips(players[sbI], G.sb); players[sbI].lastAction = 'SB ' + G.sb;
  putChips(players[bbI], G.bb); players[bbI].lastAction = 'BB ' + G.bb;
  G.currentBet = G.bb; G.minRaise = G.bb;
  setControls('wait');
  render();
  for (let r = 0; r < 2; r++) {
    for (let k = 1; k <= N; k++) {
      const p = players[(G.dealer + k) % N];
      if (!p.inHand) continue;
      p.hand.push(G.deck.pop()); SFX.deal(); render();
      await sleep(85);
    }
  }
  G.toAct = next(bbI);
  updateCoach();
  loop();
}

function roundDone() {
  const live = players.filter(canAct);
  if (live.every(p => p.acted && p.bet === G.currentBet)) return true;
  if (live.length === 1 && live[0].bet >= G.currentBet) return true;
  return false;
}

async function loop() {
  for (;;) {
    if (contenders().length === 1) { await settle(false); return; }
    if (roundDone()) {
      if (G.phase === 'river') { await settle(true); return; }
      await nextStreet();
      continue;
    }
    const p = players[G.toAct];
    if (!canAct(p) || (p.acted && p.bet === G.currentBet)) { G.toAct = next(G.toAct); continue; }
    if (p.isHuman) { promptHuman(); return; }
    G.thinking = p.seat; setControls('wait'); render();
    await sleep(600 + Math.random() * 600);
    const a = aiDecide(p);
    G.thinking = -1;
    applyAction(p, a);
    G.toAct = next(G.toAct);
  }
}

function applyAction(p, a) {
  const toCall = G.currentBet - p.bet;
  let label = '', cls = '';
  if (a.type === 'fold') {
    p.folded = true; label = '폴드'; SFX.fold();
  } else if (a.type === 'check' || (a.type === 'call' && toCall <= 0)) {
    label = '체크'; SFX.check();
  } else if (a.type === 'call') {
    const amt = putChips(p, toCall);
    label = p.allIn ? `올인 ${fmt(p.bet)}` : `콜 ${fmt(amt)}`; SFX.chip();
  } else {
    const to = Math.min(a.to, p.bet + p.chips);
    if (to <= G.currentBet) return applyAction(p, { type: 'call' });
    const was = G.currentBet;
    putChips(p, to - p.bet);
    if (to - was >= G.minRaise) G.minRaise = to - was;
    G.currentBet = to; G.raises++;
    players.forEach(o => { if (o !== p && canAct(o)) o.acted = false; });
    label = p.allIn ? `올인 ${fmt(to)}` : (was === 0 ? `벳 ${fmt(to)}` : `레이즈 ${fmt(to)}`);
    SFX.chip();
    if (p.isHuman && G.phase === 'preflop') progress('pfRaise');
  }
  if (p.isHuman && p.allIn) G.humanAllIn = true;
  p.acted = true; p.lastAction = label;
  addLog(`<b>${p.isHuman ? '나' : p.name}</b> ${label}`);
  if (p.isHuman) save();
  render();
}

async function nextStreet() {
  players.forEach(p => { p.bet = 0; p.acted = false; p.lastAction = p.folded ? '폴드' : p.allIn ? '올인' : ''; });
  G.currentBet = 0; G.minRaise = G.bb; G.raises = 0;
  const nCards = G.phase === 'preflop' ? 3 : 1;
  G.phase = G.phase === 'preflop' ? 'flop' : G.phase === 'flop' ? 'turn' : 'river';
  // 올인 런아웃이면 카드 공개
  if (players.filter(canAct).length <= 1 && contenders().length > 1) {
    contenders().forEach(p => { p.revealed = true; });
  }
  render();
  await sleep(450);
  G.deck.pop(); // burn
  for (let i = 0; i < nCards; i++) { G.board.push(G.deck.pop()); SFX.deal(); render(); await sleep(170); }
  addLog(`${PHASE_LABEL[G.phase]}: ${G.board.map(c => rch(c.r) + SUITS[c.s]).join(' ')}`);
  G.toAct = next(G.dealer);
  if (players.filter(canAct).length <= 1) await sleep(650);
}

function refundUncalled() {
  const sorted = [...players].sort((a, b) => b.total - a.total);
  const d = sorted[0].total - sorted[1].total;
  if (d > 0) { sorted[0].total -= d; sorted[0].bet = Math.max(0, sorted[0].bet - d); sorted[0].chips += d; }
}

async function settle(showdown) {
  refundUncalled();
  const won = new Map();
  const cs = contenders();
  const order = p => (p.seat - G.dealer - 1 + N) % N;
  if (!showdown) {
    won.set(cs[0], potTotal());
  } else {
    G.phase = 'showdown';
    cs.forEach(p => { p.best = best(p.hand.concat(G.board)); p.revealed = true; p.lastAction = describe(p.best.score); });
    render();
    await sleep(700);
    const levels = [...new Set(players.filter(p => p.total > 0).map(p => p.total))].sort((a, b) => a - b);
    let prev = 0, carry = 0;
    for (const L of levels) {
      let amt = carry; carry = 0;
      players.forEach(p => { amt += Math.max(0, Math.min(p.total, L) - prev); });
      prev = L;
      const elig = cs.filter(p => p.total >= L);
      if (!elig.length) { carry = amt; continue; }
      const top = Math.max(...elig.map(p => p.best.score));
      const ws = elig.filter(p => p.best.score === top).sort((a, b) => order(a) - order(b));
      const share = Math.floor(amt / ws.length);
      let rem = amt - share * ws.length;
      ws.forEach(p => { won.set(p, (won.get(p) || 0) + share + (rem-- > 0 ? 1 : 0)); });
    }
    if (carry > 0) {
      const topP = cs.reduce((a, b) => (b.best.score > a.best.score ? b : a));
      won.set(topP, (won.get(topP) || 0) + carry);
    }
    const hl = new Set();
    won.forEach((v, p) => p.best.cards.forEach(c => hl.add(key(c))));
    G.highlight = hl;
  }
  won.forEach((v, p) => { p.chips += v; p.winAmt = v; });
  players.forEach(p => { p.bet = 0; });
  G.phase = 'done';
  const parts = [...won.entries()].map(([p, v]) => `<b>${p.isHuman ? '당신' : p.name}</b> +${fmt(v)}${showdown ? ` · ${describe(p.best.score)}` : ''}`);
  addLog('승리: ' + parts.join(', '), 'hl');
  G.lastResult = { parts, won, showdown };
  render();
  afterHand(won, showdown);
  setControls('result');
  save();
}

/* ============ AI ============ */
function aiDecide(p) {
  const toCall = Math.max(0, G.currentBet - p.bet);
  const opps = contenders().length - 1;
  const eq = equity(p.hand, G.board, opps, G.board.length ? 240 : 170);
  const pot = potTotal();
  const odds = toCall > 0 ? toCall / (pot + toCall) : 0;
  const rel = eq * (opps + 1);
  const st = p.st, r = Math.random();
  const stack = p.chips;
  const pre = G.board.length === 0;
  const canRaise = stack > toCall && G.raises < 4;
  const raiseTo = frac => {
    const amt = Math.max(G.minRaise, Math.round((pot + toCall) * frac / 5) * 5);
    return Math.min(G.currentBet + amt, p.bet + stack);
  };
  if (canRaise && (eq > .82 || rel > 2.3)) {
    if (r < .3 + st.aggr * .35) return { type: 'raise', to: eq > .9 && r < .25 ? p.bet + stack : raiseTo(.7 + Math.random() * .5) };
    return toCall > 0 ? { type: 'call' } : (r < .6 ? { type: 'check' } : { type: 'raise', to: raiseTo(.45) });
  }
  if (canRaise && rel > 1.5 - st.aggr * .35 && r < .3 + st.aggr * .45) return { type: 'raise', to: raiseTo(.45 + Math.random() * .4) };
  if (toCall === 0) {
    if (canRaise && r < st.bluff * .35 && opps <= 2) return { type: 'raise', to: raiseTo(.5) };
    return { type: 'check' };
  }
  let need = (pre ? odds * .75 : odds) - st.loose * .1 + G.raises * .035;
  if (toCall >= stack) need += .08;
  if (eq >= need || (pre && toCall <= G.bb && st.loose > .5 && r < .7)) return { type: 'call' };
  if (canRaise && r < st.bluff * .12) return { type: 'raise', to: raiseTo(.7) };
  return { type: 'fold' };
}

function raiseBounds() {
  const me = players[0];
  const maxTo = me.bet + me.chips;
  const minTo = Math.min(G.currentBet + G.minRaise, maxTo);
  return { minTo, maxTo, can: maxTo > G.currentBet && G.raises < 6 };
}

const RANK_TITLES = [[1, '브론즈 루키'], [3, '실버 플레이어'], [5, '골드 샤크'], [8, '플래티넘 프로'], [11, '다이아 레전드'], [15, '홀덤 그랜드마스터']];
const titleOf = lv => RANK_TITLES.filter(t => lv >= t[0]).pop()[1];
const xpNeed = lv => 100 + (lv - 1) * 60;

function addXP(n) {
  profile.xp += n;
  while (profile.xp >= xpNeed(profile.level)) {
    profile.xp -= xpNeed(profile.level);
    profile.level++;
    const reward = 150 * profile.level;
    players[0].chips += reward;
    SFX.level(); confetti(160);
    toast(profile.level, `레벨 업! Lv.${profile.level}`, `${titleOf(profile.level)} · 보상 +${fmt(reward)}칩`);
    if (profile.level >= 5) unlock('gold');
  }
  renderHud();
}

function newMission(exclude) {
  const pool = MISSION_POOL.filter(m => !exclude.includes(m.id));
  const m = pool[rand(pool.length)];
  return { id: m.id, prog: 0, done: false };
}
function ensureMissions() {
  profile.missions = (profile.missions || []).filter(m => MISSION_POOL.some(d => d.id === m.id));
  while (profile.missions.length < 3) profile.missions.push(newMission(profile.missions.map(m => m.id)));
}
function progress(type, n = 1) {
  let changed = false;
  profile.missions.forEach(m => {
    const d = MISSION_POOL.find(x => x.id === m.id);
    if (d.type !== type || m.done) return;
    m.prog = Math.min(d.goal, m.prog + n); changed = true;
    if (m.prog >= d.goal) { m.done = true; toast('✓', '미션 완료!', `${d.text} — 보상을 받으세요`); SFX.ach(); }
  });
  if (changed) renderMissions();
}
function claimMission(idx) {
  if (!isIdle()) return;
  const m = profile.missions[idx], d = MISSION_POOL.find(x => x.id === m.id);
  if (!m.done) return;
  players[0].chips += d.chips;
  addLog(`미션 보상 <b>+${fmt(d.chips)}칩</b> · ${d.text}`, 'hl');
  profile.missions.splice(idx, 1, newMission(profile.missions.map(x => x.id)));
  addXP(d.xp);
  confetti(70);
  renderAll(); save();
}

function afterHand(won, showdown) {
  const me = players[0], st = profile.stats;
  const myWin = won.get(me) || 0;
  const meIn = me.inHand && !me.folded;
  const myCat = meIn && G.board.length >= 3 ? catOf(bestScore(me.hand.concat(G.board))) : -1;
  let xp = 5;
  progress('play');
  if (myWin > 0) {
    st.wins++; profile.streak++;
    st.bestStreak = Math.max(st.bestStreak, profile.streak);
    st.biggestPot = Math.max(st.biggestPot, myWin);
    xp += 25 + Math.floor(myWin / 40) + (showdown ? Math.max(0, myCat) * 5 : 0);
    progress('win');
    if (showdown) { st.sdWins++; progress('sdWin'); if (myCat >= 2) progress('winCat2'); }
    else progress('foldWin');
    if (G.humanAllIn) progress('allinWin');
    if (myWin >= 600) progress('bigPot');
    unlock('first_win');
    if (profile.streak >= 3) unlock('streak3');
    if (profile.streak >= 5) unlock('streak5');
    if (myWin >= 1000) unlock('highroller');
    if (myCat <= 0) unlock('bluff');
    if (G.chipsBefore <= 200) unlock('comeback');
    SFX.win();
    confetti(myWin >= 500 ? 140 : 60);
  } else if (me.total > 0) {
    profile.streak = 0;
    SFX.lose();
  }
  if (myCat >= 4) progress('makeCat4');
  if (myCat >= 5) unlock('flush');
  if (myCat >= 6) unlock('fullhouse');
  if (myCat >= 7) unlock('quads');
  if (myCat >= 8) unlock('royal');
  if (st.hands >= 50) unlock('veteran');
  addXP(xp);
  renderAll();
}

function cardHTML(c, faceUp, anim, hl) {
  if (!faceUp) return `<div class="card back ${anim}" aria-label="뒷면 카드"></div>`;
  let cls = 'card ' + (c.s === 1 || c.s === 2 ? 'red' : 'black') + ' ' + anim;
  if (hl) cls += hl.has(key(c)) ? ' win' : ' dim';
  return `<div class="${cls}" aria-label="${SUIT_NAME[c.s]} ${rch(c.r)}"><div class="tl">${rch(c.r)}<span>${SUITS[c.s]}</span></div><div class="mid">${SUITS[c.s]}</div></div>`;
}
function renderCards(el, cards, faceUp, slots, hl) {
  const sig = cards.map(c => (faceUp ? key(c) : 'b') + (hl ? (hl.has(key(c)) ? 'w' : 'd') : '')).join(',') + '|' + slots;
  if (el.dataset.sig === sig) return;
  const prevN = +(el.dataset.n || 0), prevFace = el.dataset.face === '1';
  const base = cards.length < prevN ? 0 : prevN;
  let html = cards.map((c, i) => cardHTML(c, faceUp, i >= base ? 'deal' : (faceUp && !prevFace ? 'flip' : ''), hl)).join('');
  for (let i = cards.length; i < slots; i++) html += '<div class="slot"></div>';
  el.innerHTML = html;
  el.dataset.sig = sig; el.dataset.n = cards.length; el.dataset.face = faceUp ? '1' : '0';
}

/* ============ Coach ============ */
function updateCoach() {
  const box = $('#coach');
  box.hidden = !profile.coach;
  if (!profile.coach) return;
  const me = players[0];
  if (!me.hand.length || me.folded) {
    $('#coachHand').textContent = me.folded ? '이번 핸드는 폴드했습니다. 상대들의 플레이 스타일을 관찰해 보세요.' : '카드를 받으면 현재 족보와 예상 승률을 알려드려요.';
    $('#coachEq').textContent = '—'; $('#coachMeter').style.width = '0';
    return;
  }
  const opps = contenders().length - 1;
  const eq = equity(me.hand, G.board, opps, 400);
  const toCall = Math.max(0, G.currentBet - me.bet);
  const odds = toCall > 0 ? toCall / (potTotal() + toCall) : 0;
  $('#coachHand').innerHTML = `현재 <b>${describePartial(me.hand, G.board)}</b> · 상대 ${opps}명`;
  $('#coachEq').textContent = `승률 ${Math.round(eq * 100)}%`;
  $('#coachMeter').style.width = Math.round(eq * 100) + '%';
  let tip;
  if (toCall === 0) tip = eq > 1.6 / (opps + 1) ? '강한 편입니다. 벳으로 팟을 키워 보세요.' : '무료로 다음 카드를 볼 수 있어요. 체크도 좋은 선택입니다.';
  else if (eq > odds + .15) tip = `팟 오즈 ${Math.round(odds * 100)}%보다 승률이 확실히 높습니다. 콜 이상이 유리해요.`;
  else if (eq >= odds) tip = `팟 오즈 ${Math.round(odds * 100)}%와 승률이 비슷합니다. 콜은 손해가 적은 선택이에요.`;
  else tip = `콜하려면 승률이 ${Math.round(odds * 100)}% 이상 필요합니다. 지금은 폴드가 안전해요.`;
  $('#coachTip').textContent = tip;
}

/* ============ Toast / Modal / Confetti ============ */
function toast(glyph, title, sub) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = `<i>${glyph}</i><div><b>${title}</b><small>${sub}</small></div>`;
  $('#toasts').appendChild(t);
  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, 3400);
}
function modal(html, onMount) {
  const root = $('#modalRoot');
  root.innerHTML = `<div class="modal-bg" id="mbg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#mbg').addEventListener('click', e => { if (e.target.id === 'mbg' && !root.dataset.lock) closeModal(); });
  onMount && onMount();
}
function closeModal() { $('#modalRoot').innerHTML = ''; delete $('#modalRoot').dataset.lock; }

function showRanks() {
  const C = (r, s) => ({ r, s });
  const rows = [
    ['로열 플러시', [C(14, 0), C(13, 0), C(12, 0), C(11, 0), C(10, 0)], '0.003%'],
    ['스트레이트 플러시', [C(9, 1), C(8, 1), C(7, 1), C(6, 1), C(5, 1)], '0.03%'],
    ['포카드', [C(13, 0), C(13, 1), C(13, 2), C(13, 3), C(3, 0)], '0.17%'],
    ['풀하우스', [C(12, 0), C(12, 1), C(12, 3), C(7, 2), C(7, 0)], '2.60%'],
    ['플러시', [C(14, 2), C(11, 2), C(8, 2), C(6, 2), C(2, 2)], '3.03%'],
    ['스트레이트', [C(10, 3), C(9, 1), C(8, 0), C(7, 2), C(6, 0)], '4.62%'],
    ['트리플', [C(8, 0), C(8, 1), C(8, 3), C(13, 2), C(4, 0)], '4.83%'],
    ['투 페어', [C(11, 1), C(11, 3), C(5, 0), C(5, 2), C(14, 0)], '23.5%'],
    ['원 페어', [C(10, 0), C(10, 2), C(13, 3), C(7, 1), C(3, 0)], '43.8%'],
    ['하이카드', [C(14, 1), C(12, 0), C(9, 3), C(6, 2), C(3, 0)], '17.4%']
  ];
  modal(`<h3>포커 족보</h3><p>위에 있을수록 강합니다. 오른쪽 숫자는 7장(내 카드 2 + 공용 5) 중 최고 패가 그 족보일 확률입니다.</p>
    <div class="ranks">${rows.map(([n, cs, pct]) => `<div class="rank"><b>${n}</b><div class="mini">${cs.map(c => cardHTML(c, true, '', null)).join('')}</div><small>${pct}</small></div>`).join('')}</div>
    <div class="row"><button class="big" id="mClose" type="button">닫기</button></div>`, () => $('#mClose').onclick = closeModal);
}

function checkDaily() {
  const today = localDay(new Date());
  if (profile.lastDaily === today) return;
  const yest = localDay(new Date(Date.now() - 864e5));
  const streak = profile.lastDaily === yest ? (profile.loginStreak % 7) + 1 : 1;
  const reward = d => 100 + 50 * (d - 1);
  const days = Array.from({ length: 7 }, (_, i) => i + 1).map(d =>
    `<div class="day ${d < streak ? 'done' : d === streak ? 'today' : ''}">${d}일<b>${reward(d)}</b></div>`).join('');
  $('#modalRoot').dataset.lock = '1';
  modal(`<h3>출석 보너스 · ${streak}일째</h3><p>매일 접속하면 보상이 커집니다. 7일 연속이면 하루 400칩!</p>
    <div class="days">${days}</div>
    <div class="row"><button class="big" id="mClaim" type="button">${reward(streak)}칩 받기</button></div>`, () => {
    $('#mClaim').onclick = () => {
      profile.lastDaily = today; profile.loginStreak = streak;
      players[0].chips += reward(streak);
      closeModal(); SFX.ach(); confetti(80);
      toast('+', '출석 보너스', `${reward(streak)}칩과 20 XP를 받았어요`);
      addXP(20); renderAll(); save();
    };
  });
}

function showBroke() {
  $('#modalRoot').dataset.lock = '1';
  modal(`<h3>칩이 모두 떨어졌어요</h3><p>괜찮습니다. 프로도 버스트를 겪어요. 지원금 1,000칩으로 다시 도전하세요. 레벨과 업적은 그대로 유지됩니다.</p>
    <div class="row"><button class="big" id="mRebuy" type="button">1,000칩 받고 계속</button></div>`, () => {
    $('#mRebuy').onclick = () => {
      players[0].chips = 1000; profile.stats.rebuys++; profile.streak = 0;
      closeModal(); save(); renderAll(); startHand();
    };
  });
}

/* confetti */
const cv = $('#confetti'), cx = cv.getContext('2d');
let parts = [], raf = 0;
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n) {
  if (reduce || speed < .2) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#f3d58a', '#d9a94a', '#5fd28f', '#e5604f', '#f8f4e9', '#6aa8ff'];
  for (let i = 0; i < n; i++) parts.push({ x: innerWidth * (.3 + Math.random() * .4), y: innerHeight * .45, vx: (Math.random() - .5) * 12, vy: -Math.random() * 13 - 4, s: 4 + Math.random() * 6, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[rand(cols.length)], life: 0 });
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.life < 140 && p.y < cv.height + 20);
  for (const p of parts) {
    p.life++; p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.fillStyle = p.c; cx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, cv.width, cv.height);
}
function clearConfetti() { parts = []; }

/* ============ Wiring ============ */
$('#btnRanks').onclick = showRanks;
const soundBtn = $('#btnSound'), coachBtn = $('#btnCoach');
function syncToggles() {
  soundBtn.setAttribute('aria-pressed', profile.sound); soundBtn.textContent = profile.sound ? '사운드 켬' : '사운드';
  coachBtn.setAttribute('aria-pressed', profile.coach);
  $('#coach').hidden = !profile.coach;
}
soundBtn.onclick = () => { profile.sound = !profile.sound; syncToggles(); SFX.ach(); save(); };
coachBtn.onclick = () => { profile.coach = !profile.coach; syncToggles(); if (profile.coach) updateCoach(); save(); };
document.getElementById('missions').addEventListener('click', e => {
  const b = e.target.closest('[data-claim]');
  if (b) claimMission(+b.dataset.claim);
});
document.addEventListener('keydown', e => {
  if ($('#modalRoot').children.length) { if (e.key === 'Escape' && !$('#modalRoot').dataset.lock) closeModal(); return; }
  if (e.target.tagName === 'INPUT' && e.key !== 'Enter') { if (!/^[fcrFCR]$/.test(e.key)) return; }
  const k = e.key.toLowerCase();
  if (ctrlMode === 'human') {
    if (k === 'f') $('#bFold').click();
    else if (k === 'c') $('#bCall').click();
    else if (k === 'r' && !$('#bRaise').disabled) $('#bRaise').click();
  } else if (ctrlMode === 'result' && k === 'enter') { e.preventDefault(); startHand(); }
});

ensureMissions();
buildSeats();
syncToggles();
setControls('idle');
renderAll();
addLog('테이블에 앉았습니다. <b>첫 핸드 딜하기</b>를 눌러 시작하세요.');
setTimeout(checkDaily, 400);

// 테스트·디버그용 훅
window.__holdem = { G, players, humanAct, startHand, raiseBounds, setSpeed: v => { speed = v; }, eval: best };
})();
</script>
